dataset_path: deep-principle/science_materials
dataset_kwargs:
  revision: af1c11c8dc0ebbd4b10323a4916e910f1f48a00c
dataset_name: battery-electrolyte-qa
test_split: test

process_docs: !function utils.process_battery_electrolyte_qa
doc_to_text: >
  You are an expert in battery electrolyte chemistry. Use your expert knowledge to answer the multiple choice question below.
  
  Wrap your final answer(s) in <answer>X</answer> tags, where X can be a single letter or comma-separated list of letters.
  For example, if A, B, and C are correct, write: <answer>A,B,C</answer> and if just B is correct, write: <answer>B</answer>.

  Your output should not contain any additional text or explanations! Only the answer as shown above


  {{Question}}
  A: {{Option_A}}
  B: {{Option_B}}
  C: {{Option_C}}
  D: {{Option_D}}
  Answer:
doc_to_target: Answer
task: battery_electrolyte_qa
filter_list:
  - name: xml-extract
    filter:
      - function: regex
        regex_pattern: "<answer>(.*?)</answer>"
        group_select: 0
        fallback: "[invalid]"
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "Answer:"
  do_sample: false
  temperature: 0.0
num_fewshot: 0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

# >>> provenance metadata (managed by sync_task_metadata.py) >>>
metadata:
  version: '0.1'
  provenance:
    source_type: expert_authored
    source: Manually authored by a domain expert; liquid electrolytes for lithium metal batteries;
      distractor options reflect common misconceptions.
    source_refs: []
    construction_date: '2025-07-01'
    overlap_check: Manually curated by domain experts, no overlap with existing benchmark
      and datasets
    evaluation_status: evaluated
