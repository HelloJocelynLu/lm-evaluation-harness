dataset_path: deep-principle/science_materials
dataset_kwargs:
  revision: af1c11c8dc0ebbd4b10323a4916e910f1f48a00c
dataset_name: composites-qa
test_split: test

process_docs: !function utils.process_composites_qa

doc_to_text: >
  You are an expert in composite materials. Select the best answer for the following multiple choice question.

  Wrap your final answer in <answer> tags and return only that, e.g. <answer>A</answer>. Do not include any other text.

  {{Question.strip()}}
  A: {{Option_A}}
  B: {{Option_B}}
  C: {{Option_C}}
  D: {{Option_D}}
  Answer:

doc_to_target: Answer
task: composite_materials_qa
filter_list:
  - name: xml-extract
    filter:
      - function: regex
        regex_pattern: "<answer>(.*?)</answer>"
        group_select: 0
        fallback: "[invalid]"

generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "Answer:"
  do_sample: false
  temperature: 0.0

num_fewshot: 0

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

# >>> provenance metadata (managed by sync_task_metadata.py) >>>
metadata:
  version: '0.1'
  provenance:
    source_type: expert_authored
    source: Compiled from fundamental mechanics theory and domain knowledge. Only 1/22 rows
      carry a source URL in the released data.
    source_refs: []
    basis: SI materials curation (composite materials Q&A); dataset Source column (partial)
    construction_date: to_confirm
    dedup: to_confirm
    overlap_check: to_confirm
    evaluation_status: evaluated
# <<< provenance metadata (managed by sync_task_metadata.py) <<<
