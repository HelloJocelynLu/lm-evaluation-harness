dataset_path: deep-principle/science_materials
dataset_kwargs:
  revision: af1c11c8dc0ebbd4b10323a4916e910f1f48a00c
dataset_name: basic-materials-science-qa
test_split: test

process_docs: !function utils.process_materials_science_qa

doc_to_text: >
  You are an expert in materials science. Select the correct answer from the choices below.

  Wrap your final answer in <answer> tags, do not include any additional text or explanations in your response.
  Only answer with the letter corresponding to the correct option, for example: <answer>A</answer>

  {{Question.strip()}}
  A: {{Option_A}}
  B: {{Option_B}}
  C: {{Option_C}}
  D: {{Option_D}}
  Answer:

doc_to_target: Answer
task: general_materials_science_qa
filter_list:
  - name: xml-extract
    filter:
      - function: regex
        regex_pattern: "<answer>(.*?)</answer>"
        group_select: 0
        fallback: "[invalid]"

generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "Answer:"
  do_sample: false
  temperature: 0.0

num_fewshot: 0

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

# >>> provenance metadata (managed by sync_task_metadata.py) >>>
metadata:
  version: '0.1'
  provenance:
    source_type: expert_authored
    source: Sourced from expert domain knowledge and first-principles theory; the released
      Source column exists but is empty in all 29 rows.
    source_refs: []
    basis: SI materials curation (general materials science Q&A); dataset Source column (empty)
    construction_date: to_confirm
    dedup: to_confirm
    overlap_check: to_confirm
    evaluation_status: evaluated
