  version: '0.1'
  provenance:
    source_type: expert_authored
    source: Manually curated mathematical reasoning questions for statistical physics and
      data analysis.
    source_refs: []
    basis: SI physics curation; dataset Reference column holds contributor names only
    construction_date: to_confirm
