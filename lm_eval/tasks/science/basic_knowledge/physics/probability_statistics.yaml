include: "_default_multi_choice_yaml"
# Task: Probability/Statistics multiple choice questions
process_docs: !function utils.process_probability_statistics
doc_to_text: >
  You are an expert in Probability and Statistics. The following are multiple choice questions about probability and statistics.
  Let's think step by step. Please wrap the final answer in XML tags: <answer>X</answer> (where X can be A, B, C, D, or combinations like AB, ABC, etc.)
  Question: {{Question.strip()}}
  A: {{Option_A}}
  B: {{Option_B}}
  C: {{Option_C}}
  D: {{Option_D}}
  Answer:
task: multiple_choice_probability_statistics 

