include: "_default_multi_choice_yaml"
# Uses specific task filtering: 3 MC samples
process_docs: !function utils.process_condensed_matter_physics
doc_to_text: >
  You are an expert in Condensed Matter Physics. The following are multiple choice questions about condensed matter physics.
  Let's think step by step. Please wrap the final answer in XML tags: <answer>X</answer> (where X can be A, B, C, D, or combinations like AB, ABC, etc.)
  Question: {{Question.strip()}}
  A: {{Option_A}}
  B: {{Option_B}}
  C: {{Option_C}}
  D: {{Option_D}}
  Answer:
task: multiple_choice_condensed_matter_physics

# >>> provenance metadata (managed by sync_task_metadata.py) >>>
metadata:
  version: '0.1'
  provenance:
    source_type: expert_authored
    source: Manually curated conceptual and derivation questions in condensed matter physics.
    source_refs: []
    basis: SI physics curation; dataset Reference column holds contributor names only
    construction_date: to_confirm
    dedup: to_confirm
    overlap_check: to_confirm
    evaluation_status: evaluated
# <<< provenance metadata (managed by sync_task_metadata.py) <<<
