dataset_path: deep-principle/science-chemistry
dataset_kwargs:
  revision: c4cd509e1d1fe29bb56a474f5bbd2a62d5b67366
dataset_name: redox_potential
test_split: test
doc_to_text: >-
  {{Question}}
  Please wrap the final answer in XML tags: <answer>X</answer> (where X is a float number.)
  Answer:
doc_to_target: Answer
task: science_chem_redox_potential
process_results: !function utils.eval_redox_potential
filter_list:
  - name: "xml-extract"
    filter:
      - function: "regex"
        regex_pattern: "<answer>(.*?)</answer>"
        group_select: 0
        fallback: "[invalid]"
generation_kwargs:
  max_tokens: 4096
  until:
    - "</s>"
    - "Q:"
    - "<|im_end|>"
  do_sample: false
num_fewshot: 0
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true


