dataset_path: deep-principle/science-chemistry
dataset_kwargs:
  revision: c4cd509e1d1fe29bb56a474f5bbd2a62d5b67366
dataset_name: mw2formula
test_split: test
doc_to_text: >
  You are an expert Chemist. {{Question}}
  Please wrap the final answer in XML tags: <answer>X</answer> (where X is Chemical formula like C2H6O)
  Answer:
doc_to_target: Answer
task: science_chem_mw_to_formula
filter_list:
  - name: "xml-extract"
    filter:
      - function: "regex"
        regex_pattern: "<answer>(.*?)</answer>"
        group_select: 0
        fallback: "[invalid]"
generation_kwargs:
  max_tokens: 4096
  until:
    - "</s>"
    - "Q:"
    - "<|im_end|>"
  do_sample: false
num_fewshot: 0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    ignore_numbers: false

# >>> provenance metadata (managed by sync_task_metadata.py) >>>
metadata:
  version: '0.1'
  provenance:
    source_type: expert_authored
    source: Manually curated by domain experts; the studied compound for each item is recorded
      in the dataset Reference column.
    source_refs: []
    basis: SI chemistry curation; dataset Reference column (holds compound names)
    construction_date: to_confirm
    dedup: to_confirm
    overlap_check: to_confirm
    evaluation_status: evaluated
