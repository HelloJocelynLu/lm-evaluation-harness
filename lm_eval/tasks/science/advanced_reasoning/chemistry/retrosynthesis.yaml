include: "_default_multiple_choice_yaml"
process_docs: !function utils.process_retrosynthesis
doc_to_text: >
  You are an expert in organic chemistry. The following are multiple choice questions about Retrosynthesis. Let's think step by step. Please wrap the final answer in XML tags: <answer>X</answer> (where X is A, B, C, or D)
  Question: {{Question.strip()}}
  A: {{Option_A}}
  B: {{Option_B}}
  C: {{Option_C}}
  D: {{Option_D}}
  Answer:
task: science_chem_retrosynthesis

# >>> provenance metadata (managed by sync_task_metadata.py) >>>
metadata:
  version: '0.1'
  provenance:
    source_type: mixed
    source: Benchmark-style sources (GPQA) plus template-based sampling from USPTO using known
      reaction templates (USPTO_TPL).
    source_refs:
    - GPQA
    - USPTO_TPL
    basis: SI chemistry curation; dataset Reference column (12/48 rows list GPQA)
    construction_date: to_confirm
    dedup: to_confirm
    overlap_check: to_confirm
    evaluation_status: evaluated
