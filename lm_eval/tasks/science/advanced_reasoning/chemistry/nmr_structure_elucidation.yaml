dataset_path: deep-principle/science-chemistry
dataset_kwargs:
  revision: c4cd509e1d1fe29bb56a474f5bbd2a62d5b67366
dataset_name: NMR_structure_elucidation
test_split: test

doc_to_text: >-
  You are a chemist assistant with expertise in molecular structure elucidation. {{Question}}
  Requirements:
    - Provide the structure in SMILES notation
    - The answer should be exact and canonical
    - Include only the SMILES string in your answer, wrapped in <SMILES></SMILES> tags
  Example answer format:
  <SMILES>CCN(CC)CC</SMILES>
  Answer:
doc_to_target: Answer
task: nmr_structure_elucidation
process_results: !function utils.process_smiles
filter_list:
  - name: "xml-extract"
    filter:
      - function: "regex"
        regex_pattern: "<SMILES>(.*?)</SMILES>"
        group_select: 0
        fallback: "[invalid]"
generation_kwargs:
  max_tokens: 4096
  until:
    - "</s>"
    - "Q:"
    - "<|im_end|>"
  do_sample: false
num_fewshot: 0
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true

# >>> provenance metadata (managed by sync_task_metadata.py) >>>
metadata:
  version: '0.1'
  provenance:
    source_type: mixed
    source: Two subsets. The larger subset (21 items) was generated from molecular structures
      selected from USPTO, with 1H and 13C NMR spectra predicted using NMRDB (nmrdb.org) and
      converted into question-answer pairs; those spectra are simulated rather than experimental.
      The remaining 10 items were curated from the supporting information of published studies
      and use real experimental spectra. Reference structures are given as SMILES in both
      cases.
    source_refs:
    - USPTO
    - NMRDB
    construction_date: '2025-07-14'
    overlap_check: The predicted subset draws its structures from a public database (USPTO)
      with spectra generated by NMRDB, so there is no spectroscopic dataset to overlap with;
      the remaining 10 items come from published supporting information and may overlap with
      the source publications.
    evaluation_status: evaluated
